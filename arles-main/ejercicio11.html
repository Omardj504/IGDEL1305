<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla de Multiplicar</title>

<style>
    body {
        font-family: Arial;
        background: #f2f2f2;
        text-align: center;
        padding: 40px;
    }

    .contenedor {
        background: white;
        width: 400px;
        margin: auto;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 0 15px #aaa;
    }

    input, button {
        padding: 10px;
        margin: 10px;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
    }

    li {
        margin: 5px;
    }
</style>

</head>

<body>

<div class="contenedor">

<h2>Tabla de Multiplicar</h2>

<input type="number" id="numero"
       placeholder="Ingrese un número">

<button onclick="generarTabla()">Generar</button>

<ol id="resultado"></ol>

</div>

<script>
function generarTabla() {

    let numero = Number(document.getElementById("numero").value);
    let resultado = document.getElementById("resultado");

    resultado.innerHTML = "";

    for (let i = 1; i <= 10; i++) {

        let operacion = numero + " × " + i +
                        " = " + (numero * i);

        let elemento = document.createElement("li");

        elemento.textContent = operacion;

        resultado.appendChild(elemento);
    }
}
</script>

</body>
</html>
