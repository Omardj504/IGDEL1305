<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descuento en Compras</title>

<style>
    body {
        font-family: Arial;
        background: #f2f2f2;
        text-align: center;
        padding: 50px;
    }

    .contenedor {
        background: white;
        width: 380px;
        margin: auto;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 0 15px #aaa;
    }

    input, button {
        padding: 10px;
        margin: 10px;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
    }
</style>

</head>

<body>

<div class="contenedor">

<h2>Calculadora de Descuento</h2>

<input type="number" id="monto" placeholder="Monto de compra">

<button onclick="calcular()">Calcular</button>

<p id="resultado"></p>

</div>

<script>
function calcular() {

    let monto = Number(document.getElementById("monto").value);
    let resultado = document.getElementById("resultado");

    if (monto > 100) {

        let descuento = monto * 0.10;
        let total = monto - descuento;

        resultado.innerHTML =
            "Descuento: $" + descuento.toFixed(2) +
            "<br>Total a pagar: $" + total.toFixed(2);

    } else {

        resultado.textContent =
            "Total a pagar: $" + monto.toFixed(2);
    }
}
</script>

</body>
</html>
