<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado Académico</title>

<style>
    body {
        font-family: Arial;
        background: #f2f2f2;
        text-align: center;
        padding: 50px;
    }

    .contenedor {
        background: white;
        width: 350px;
        margin: auto;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 0 15px #aaa;
    }

    input, button {
        padding: 10px;
        margin: 10px;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
    }
</style>

</head>

<body>

<div class="contenedor">

<h2>Estado Académico</h2>

<input type="number" id="nota" min="0" max="100"
       placeholder="Ingrese la nota">

<br>

<button onclick="evaluar()">Evaluar</button>

<p id="resultado"></p>

</div>

<script>
function evaluar() {

    let nota = Number(document.getElementById("nota").value);
    let resultado = document.getElementById("resultado");

    if (nota >= 70) {
        resultado.textContent = "Aprobado";
        resultado.style.color = "green";
    } else {
        resultado.textContent = "Reprobado";
        resultado.style.color = "red";
    }
}
</script>

</body>
</html>
