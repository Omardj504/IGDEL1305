<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <label for="numero">Ingrese un número:</label>
    <input type="number" id="numero" placeholder="Ingrese un número">
    <br>
     <label for="numero2">Ingrese un número2:</label>
    <input type="number" id="numero2" placeholder="Ingrese un número2">
    <br>
    <button id="submitButton">Verificar</button>

    <script>

    let numero = document.getElementById("numero");
    let numero2 = document.getElementById("numero2");
    let submitButton = document.getElementById("submitButton");
    submitButton.addEventListener("click", function() {
        
        if (numero.value > numero2.value) {
            alert("El primer número es mayor");
        } else if (numero.value < numero2.value) {
            alert("El segundo número es mayor");
        } else {
            alert("Los números son iguales");
        }
    });

    </script>
</body>
</html>
