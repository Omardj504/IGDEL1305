<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <label for="ageInput">Edad</label>
    <input type="number" id="ageInput" placeholder="Ingrese edad">
   <br>
    <button id="submitButton">Verificar Edad</button>
    <script>
        const ageInput = document.getElementById('ageInput');
        const submitButton = document.getElementById('submitButton');

        submitButton.addEventListener('click', () => {
            const age = parseInt(ageInput.value);
            if (isNaN(age)) {
                alert('Por favor, ingrese un número válido.');
                return;
            }

            if (age < 18) {
                alert('Eres menor de edad.No puedes votar.');
            } else if (age >= 18 && age < 65) {
                alert('Eres adulto. Puedes votar.');
            } else {
                alert('Eres adulto mayor. Puedes votar.');
            }
        });
    </script>
</body>
</html>
