<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Desde numero 1 hasta el que ingrese determine cuales son pares</h1>
    <label for="numero">Escriba un  numero:</label>
    <input type="number" id="numero" name="numero">
    <button id="verificar">Verificar</button>
    <script>
        document.getElementById("verificar").addEventListener("click", function() {
            var numero = parseInt(document.getElementById("numero").value);
            if (isNaN(numero)) {
                alert("Por favor, ingrese un número válido.");
                return;
            }
            var pares = [];
            for (var i = 1; i <= numero; i++) {
                if (i % 2 === 0) {
                    pares.push(i);
                }
            }
            if (pares.length > 0) {
                alert("Los números pares desde 1 hasta " + numero + " son: " + pares.join(", "));
            } else {
                alert("No hay números pares desde 1 hasta " + numero + ".");
            }
        });
        </script>
</body>
</html>
