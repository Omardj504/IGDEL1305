<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculadora de promedio final y evaluación con condición if si aprueba o reprueba</h1>
    <label for="nota1">Nota 1:</label>
    <input type="number" id="nota1" name="nota1" step="0.01" min="0" max="10">
    <label for="nota2">Nota 2:</label>
    <input type="number" id="nota2" name="nota2" step="0.01" min="0" max="10">
    <label for="nota3">Nota 3:</label>
    <input type="number" id="nota3" name="nota3" step="0.01" min="0" max="10">
    <button id="calcular">Calcular Promedio</button>
    <div id="resultado"></div>
    <script>
        document.getElementById("calcular").addEventListener("click", function() {
            var nota1 = parseFloat(document.getElementById("nota1").value);
            var nota2 = parseFloat(document.getElementById("nota2").value);
            var nota3 = parseFloat(document.getElementById("nota3").value);

            if (isNaN(nota1) || isNaN(nota2) || isNaN(nota3)) {
                alert("Por favor, ingrese notas válidas.");
                return;
            }

            var promedio = (nota1 + nota2 + nota3) / 3;
            document.getElementById("resultado").innerHTML = "El promedio final es: " + promedio.toFixed(2);
            if (promedio >= 70) {
                alert("¡Felicidades! Has aprobado con un promedio de: " + promedio.toFixed(2));
            } else {
                alert("Lo siento, has reprobado con un promedio de: " + promedio.toFixed(2));
            }
        });
    </script>
</body>
</html>
