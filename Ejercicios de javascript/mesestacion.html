<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <label for="mes">Seleccione:</label>
   <select id="mes">
        <option value="Enero">Enero</option>
        <option value="Febrero">Febrero</option>
        <option value="Marzo">Marzo</option>
        <option value="Abril">Abril</option>
        <option value="Mayo">Mayo</option>
        <option value="Junio">Junio</option>
        <option value="Julio">Julio</option>
        <option value="Agosto">Agosto</option>
        <option value="Septiembre">Septiembre</option>
        <option value="Octubre">Octubre</option>
        <option value="Noviembre">Noviembre</option>
        <option value="Diciembre">Diciembre</option>
    </select>
    <button id="calcularButton">Verificar</button>
<script>
    let mes = document.getElementById("mes");
    let calcularButton = document.getElementById("calcularButton");
    calcularButton.addEventListener("click", function() {
        switch (mes.value) {
            case "Enero": case "Febrero": case "Marzo":
                alert("Primavera");
                break;
            case "Abril": case "Mayo": case "Junio":
                alert("Verano");
                break;
            case "Julio": case "Agosto": case "Septiembre":
                alert("Otoño");
                break;
            case "Octubre": case "Noviembre": case "Diciembre":
                alert("Invierno");
                break;
            default:
                alert("Ingrese un mes valido");
        }
    });
</script>
</body>
</html>
