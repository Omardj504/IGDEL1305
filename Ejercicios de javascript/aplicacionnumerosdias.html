<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <label for="numero">Seleccione un numero:</label>   
    <input type="number" id="numero" placeholder="Ingrese un numero del 1 al 7">
    <button id="calcularButton">El dia es</button>
<script>
    let numero = document.getElementById("numero");
    let calcularButton = document.getElementById("calcularButton");

    calcularButton.addEventListener("click", function() {
        switch (numero.value) {
            case "1":
                alert("Lunes");
                break;
            case "2":
                alert("Martes");
                break;
            case "3":
                alert("Miercoles");
                break;
            case "4":
                alert("Jueves");
                break;
            case "5":
                alert("Viernes");
                break;
            case "6":
                alert("Sabado");
                break;
            case "7":
                alert("Domingo");
                break;
            default:
                alert("Ingrese un numero valido");
        }
    });
</script>
</body>
</html>
