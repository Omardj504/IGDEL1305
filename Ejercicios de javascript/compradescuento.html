<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <label for="Compra">Compra:</label>
    <input type="number" id="Compra" placeholder="Ingrese el monto de la compra">
    <button id="submitButton">Resultado</button>
    <script>
         let Compra = document.getElementById("Compra");
         let submitButton = document.getElementById("submitButton");

   
         submitButton.addEventListener("click", function() {
               if (Compra.value >= 100) {
                  alert("Se le aplicará un descuento del 10%");
                  alert("El total a pagar es: " + (Compra.value - (Compra.value * 0.10)));
               } else {
                  alert("No se le aplicará ningún descuento");
                  alert("El total a pagar es: " + Compra.value);
               }
         });
    </script>
</body>
</html>
